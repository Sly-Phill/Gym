<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Yoga: seated meditation with a halo -->
  <defs>
    <linearGradient id="c" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="200" y2="200"><stop offset="0" stop-color="#d4c2ff"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
    <linearGradient id="bg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="200" y2="200"><stop offset="0" stop-color="#1a1430"/><stop offset="1" stop-color="#080b0f"/></linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.36" r="0.4"><stop offset="0" stop-color="#a78bfa" stop-opacity="0.45"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
