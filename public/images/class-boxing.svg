    <path d="M62 72 C62 42 92 28 122 32 C154 37 166 66 160 98 C156 124 138 136 112 136 L84 136 C68 136 58 124 58 108 Z" fill="url(#c)"/>
    <path d="M64 96 C46 94 40 112 50 124 C57 132 70 128 74 118" fill="url(#c)"/>
    <rect x="78" y="134" width="64" height="34" rx="8" fill="#ffffff"/>
    <path d="M86 151 H134" stroke="url(#c)" stroke-width="5" stroke-linecap="round"/>
  </g>
  <path d="M86 58 C96 48 116 46 130 52" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="5" stroke-linecap="round"/>
</svg>
