<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Spin: rider on an indoor bike -->
  <defs>
    <linearGradient id="c" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="200" y2="200"><stop offset="0" stop-color="#8ff5ff"/><stop offset="1" stop-color="#00b8d9"/></linearGradient>
    <linearGradient id="bg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="200" y2="200"><stop offset="0" stop-color="#08202a"/><stop offset="1" stop-color="#080b0f"/></linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.45"><stop offset="0" stop-color="#00e5ff" stop-opacity="0.32"/><stop offset="1" stop-color="#00e5ff" stop-opacity="0"/></radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="104" r="84" fill="url(#halo)"/>
  <!-- bike -->
  <g fill="none" stroke="url(#c)" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="150" cy="140" r="24" stroke-width="7" filter="url(#glow)"/>
    <circle cx="150" cy="140" r="5" fill="#00e5ff" stroke="none"/>
    <path d="M72 102 L108 146 L150 140" stroke-width="7"/>
    <path d="M108 146 L132 88 H150" stroke-width="7"/>
    <path d="M66 102 H84" stroke-width="7"/>
    <path d="M56 172 H158" stroke-width="7"/>
    <path d="M108 146 L92 172 M150 140 L150 172" stroke-width="6" opacity="0.8"/>
  </g>
  <!-- rider -->
  <g filter="url(#glow)" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M118 66 L78 96"/>
    <path d="M114 70 L132 82 L146 88"/>
    <path d="M78 96 L104 116 L112 148"/>
    <path d="M78 96 L96 128 L100 152" opacity="0.55"/>
  </g>
  <circle cx="130" cy="52" r="12" fill="#ffffff" filter="url(#glow)"/>
  <g stroke="url(#c)" stroke-width="4" stroke-linecap="round" opacity="0.6">
    <path d="M18 92h28M12 112h34M22 132h22"/>
  </g>
</svg>
