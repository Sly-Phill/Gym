<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200">
  <!-- Track PRs: rising strength chart + trophy -->
  <defs>
    <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="320" y2="200"><stop offset="0" stop-color="#c6ff00"/><stop offset="1" stop-color="#00e5ff"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe680"/><stop offset="1" stop-color="#ffb300"/></linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c6ff00" stop-opacity="0.35"/><stop offset="1" stop-color="#c6ff00" stop-opacity="0"/></linearGradient>
    <linearGradient id="bg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="320" y2="200"><stop offset="0" stop-color="#1c1a0c"/><stop offset="1" stop-color="#080b0f"/></linearGradient>
    <radialGradient id="halo" cx="0.68" cy="0.4" r="0.45"><stop offset="0" stop-color="#ffd23f" stop-opacity="0.3"/><stop offset="1" stop-color="#ffd23f" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#fff" stroke-opacity="0.05"/></pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="320" height="200" fill="url(#bg)"/>
  <rect width="320" height="200" fill="url(#grid)"/>
  <circle cx="218" cy="80" r="100" fill="url(#halo)"/>

  <!-- chart -->
  <path d="M24 170 L74 150 L118 156 L162 120 L206 108 L250 72 L250 186 L24 186 Z" fill="url(#area)"/>
  <path d="M24 170 L74 150 L118 156 L162 120 L206 108 L250 72" fill="none" stroke="url(#g)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <g fill="#07090d" stroke="url(#g)" stroke-width="3">
    <circle cx="74" cy="150" r="5"/><circle cx="118" cy="156" r="5"/><circle cx="162" cy="120" r="5"/><circle cx="206" cy="108" r="5"/>
  </g>
  <circle cx="250" cy="72" r="8" fill="url(#g)" filter="url(#glow)"/>

  <!-- trophy -->
  <g filter="url(#glow)" transform="translate(236 14)">
    <path d="M14 6h44v18c0 14-10 24-22 24S14 38 14 24Z" fill="url(#gold)"/>
    <path d="M14 12H4v6c0 9 6 14 12 14M58 12h10v6c0 9-6 14-12 14" fill="none" stroke="url(#gold)" stroke-width="4" stroke-linecap="round"/>
    <rect x="31" y="47" width="10" height="10" fill="url(#gold)"/>
    <rect x="22" y="56" width="28" height="8" rx="2" fill="url(#gold)"/>
  </g>

  <!-- sparkles -->
  <g fill="#ffe680">
    <path d="M206 30l3 7 7 3-7 3-3 7-3-7-7-3 7-3z"/>
    <path d="M298 92l2 5 5 2-5 2-2 5-2-5-5-2 5-2z" opacity="0.8"/>
  </g>
</svg>
