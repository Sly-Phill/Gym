<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="400" height="480">
  <!-- PulseFit hero: neon line-art sprinter -->
  <defs>
    <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="400" y2="480">
      <stop offset="0" stop-color="#c6ff00"/>
      <stop offset="1" stop-color="#00e5ff"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.55" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#c6ff00" stop-opacity="0.22"/>
      <stop offset="0.6" stop-color="#00e5ff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <circle cx="205" cy="220" r="190" fill="url(#halo)"/>

  <!-- pulse line (brand motif) -->
  <path d="M0 400h120l18-40 26 78 22-58 14 20h200" fill="none" stroke="url(#g)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.55"/>

  <!-- speed lines -->
  <g stroke="url(#g)" stroke-linecap="round" opacity="0.6">
    <path d="M22 168h70" stroke-width="6"/>
    <path d="M8 206h92" stroke-width="6"/>
    <path d="M40 246h52" stroke-width="6"/>
    <path d="M18 286h64" stroke-width="5" opacity="0.6"/>
  </g>

  <!-- sprinter -->
  <g filter="url(#glow)" fill="none" stroke="url(#g)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round">
    <!-- back arm -->
    <path d="M214 140 L160 180 L128 222"/>
    <!-- back leg -->
    <path d="M186 246 L148 322 L84 350 L68 334"/>
    <!-- torso -->
    <path d="M222 128 L186 246"/>
    <!-- front leg -->
    <path d="M186 246 L254 300 L238 382 L266 388"/>
    <!-- front arm -->
    <path d="M214 140 L266 176 L292 134"/>
  </g>
  <circle cx="236" cy="88" r="28" fill="url(#g)" filter="url(#glow)"/>

  <!-- ground glow -->
  <ellipse cx="200" cy="420" rx="150" ry="10" fill="#c6ff00" opacity="0.12"/>
</svg>
