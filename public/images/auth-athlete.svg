<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <!-- PulseFit auth pages: neon line-art overhead press -->
  <defs>
    <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="400" y2="500">
      <stop offset="0" stop-color="#c6ff00"/>
      <stop offset="1" stop-color="#00e5ff"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10161f"/>
      <stop offset="1" stop-color="#07090d"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#c6ff00" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="400" height="500" rx="36" fill="url(#bg)"/>
  <rect width="400" height="500" rx="36" fill="url(#grid)"/>
  <circle cx="200" cy="190" r="190" fill="url(#halo)"/>

  <!-- barbell -->
  <g filter="url(#glow)">
    <path d="M70 92H330" stroke="url(#g)" stroke-width="10" stroke-linecap="round"/>
    <rect x="72" y="58" width="22" height="68" rx="7" fill="url(#g)"/>
    <rect x="98" y="68" width="14" height="48" rx="5" fill="url(#g)" opacity="0.8"/>
    <rect x="306" y="58" width="22" height="68" rx="7" fill="url(#g)"/>
    <rect x="288" y="68" width="14" height="48" rx="5" fill="url(#g)" opacity="0.8"/>
  </g>

  <!-- athlete -->
  <g filter="url(#glow)" fill="none" stroke="url(#g)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round">
    <path d="M168 190 L138 142 L150 96"/>
    <path d="M232 190 L262 142 L250 96"/>
    <path d="M168 190 H232"/>
    <path d="M200 180 V304"/>
    <path d="M200 304 L168 382 L160 452"/>
    <path d="M200 304 L232 382 L240 452"/>
  </g>
  <circle cx="200" cy="146" r="25" fill="url(#g)" filter="url(#glow)"/>

  <!-- floor + pulse -->
  <path d="M40 462H360" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>
  <path d="M60 476h96l12-24 18 46 14-34 10 12h130" fill="none" stroke="url(#g)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
</svg>
