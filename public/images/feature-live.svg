<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200">
  <!-- Live mode: rest-timer ring + set pills -->
  <defs>
    <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="320" y2="200"><stop offset="0" stop-color="#c6ff00"/><stop offset="1" stop-color="#00e5ff"/></linearGradient>
    <linearGradient id="bg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="320" y2="200"><stop offset="0" stop-color="#0b1a1f"/><stop offset="1" stop-color="#080b0f"/></linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.45" r="0.5"><stop offset="0" stop-color="#00e5ff" stop-opacity="0.3"/><stop offset="1" stop-color="#00e5ff" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#fff" stroke-opacity="0.05"/></pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="320" height="200" fill="url(#bg)"/>
  <rect width="320" height="200" fill="url(#grid)"/>
  <circle cx="160" cy="88" r="105" fill="url(#halo)"/>

  <!-- stopwatch -->
  <rect x="150" y="12" width="20" height="10" rx="3" fill="url(#g)"/>
  <circle cx="160" cy="84" r="54" fill="none" stroke="#fff" stroke-opacity="0.1" stroke-width="10"/>
  <!-- 70% remaining arc -->
  <circle cx="160" cy="84" r="54" fill="none" stroke="url(#g)" stroke-width="10" stroke-linecap="round"
          stroke-dasharray="237.5 339.3" transform="rotate(-90 160 84)" filter="url(#glow)"/>
  <!-- hand -->
  <path d="M160 84V50" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
  <path d="M160 84l20 14" stroke="#fff" stroke-opacity="0.6" stroke-width="5" stroke-linecap="round"/>
  <circle cx="160" cy="84" r="7" fill="url(#g)"/>

  <!-- set pills -->
  <g>
    <rect x="70" y="158" width="52" height="26" rx="8" fill="url(#g)"/>
    <path d="M88 171l5 5 10-10" fill="none" stroke="#07090d" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="134" y="158" width="52" height="26" rx="8" fill="url(#g)"/>
    <path d="M152 171l5 5 10-10" fill="none" stroke="#07090d" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="198" y="158" width="52" height="26" rx="8" fill="none" stroke="#fff" stroke-opacity="0.3" stroke-width="2.5"/>
    <path d="M216 171h16" stroke="#fff" stroke-opacity="0.5" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
